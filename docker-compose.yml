services:
  api:
    build: ./backend
    container_name: 404found-api
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,https://athaurian.github.io}
    volumes:
      - ./mock-data:/app/mock-data:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/reports').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
